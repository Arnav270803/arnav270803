<svg viewBox="0 0 600 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="stack — agents, languages, web, infra">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
  </style>
  <defs>
    <clipPath id="scard"><rect x="1" y="1" width="598" height="258" rx="14"/></clipPath>
    <radialGradient id="sglow" gradientUnits="userSpaceOnUse" cx="540" cy="0" r="380">
      <stop offset="0" stop-color="#E8B45A" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#E8B45A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="598" height="258" rx="14" fill="#0A0A0A"/>
  <g clip-path="url(#scard)">
    <rect x="0" y="0" width="600" height="260" fill="url(#sglow)"/>
  </g>

  <text x="40" y="66" class="mono" font-size="16" letter-spacing="2" fill="#E8B45A">/</text>
  <text x="52" y="66" class="mono" font-size="16" letter-spacing="2" fill="#FAFAFA">stack</text>

  <text x="40" y="120" class="mono" font-size="15" fill="#6B6B74">agents</text>
  <text x="168" y="120" class="mono" font-size="15" fill="#D4D4D8">langgraph · langchain · langsmith · rag</text>

  <text x="40" y="154" class="mono" font-size="15" fill="#6B6B74">languages</text>
  <text x="168" y="154" class="mono" font-size="15" fill="#D4D4D8">python · typescript · javascript · c++</text>

  <text x="40" y="188" class="mono" font-size="15" fill="#6B6B74">web</text>
  <text x="168" y="188" class="mono" font-size="15" fill="#D4D4D8">react · node · express · mongodb</text>

  <text x="40" y="222" class="mono" font-size="15" fill="#6B6B74">infra</text>
  <text x="168" y="222" class="mono" font-size="15" fill="#D4D4D8">aws · docker · git</text>

  <rect x="1" y="1" width="598" height="258" rx="14" stroke="#232329" stroke-width="1.5"/>
</svg>
